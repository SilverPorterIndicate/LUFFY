name: Update TODO List

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-todo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Regenerate TODO section from changed Python files
        run: |
          python3 - <<'PYEOF'
          import re
          import subprocess
          from pathlib import Path

          readme_path = Path('README.md')
          with open(readme_path, 'r', encoding='utf-8', newline='') as f:
              readme = f.read()

          entry_re = re.compile(r'^- \[ \] \*\*(.+?):(\d+)\*\* - (.*)$', re.M)
          entries = {}
          for m in entry_re.finditer(readme):
              path, line, text = m.group(1), int(m.group(2)), m.group(3)
              entries.setdefault(path, []).append((line, text))

          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', 'origin/main', 'HEAD'], text=True
          ).splitlines()
          changed = [p for p in changed if p.endswith('.py')]
          print('Changed Python files vs main:', changed)

          def scan_todos(path):
              result = []
              with open(path, 'r', encoding='utf-8', newline='') as f:
                lines = f.read().splitlines()
              for lineno, line in enumerate(lines, 1):
                  m = re.search(r'TODO', line)
                  if m:
                      text = line[m.end():].strip()
                      if text.startswith(':'):
                          text = text[1:].strip()
                      result.append((lineno, text))
              return result

          for path in changed:
              entries.pop(path, None)
              if Path(path).exists():
                  entries[path] = scan_todos(path)

          all_entries = []
          for path, items in entries.items():
              for line, text in items:
                  all_entries.append((path, line, text))
          all_entries.sort(key=lambda x: (x[0], x[1]))

          new_block = '\n'.join(
              f'- [ ] **{path}:{line}** - {text}'
              for path, line, text in all_entries
          )

          header = '### 📝 Complete TODO List'
          marker = '## 🤝 Contributing'
          pattern = re.compile(
              '(' + re.escape(header) + r'\n\n).*?(\n\n' + re.escape(marker) + ')',
              re.S,
          )
          new_readme, n = pattern.subn(
              lambda m: m.group(1) + new_block + m.group(2), readme
          )
          if n != 1:
              raise RuntimeError(f'Expected exactly one TODO section, found {n}')

          with open(readme_path, 'w', encoding='utf-8', newline='') as f:
              f.write(new_readme)

          print('Total TODO entries:', len(all_entries))
          for path in changed:
              print(path, '->', entries.get(path))
          PYEOF

      - name: Commit README update and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "README unchanged"
          else
            git rm -f .github/workflows/update-todo-list.yml
            git commit -m "docs: update complete TODO list"
            git push origin dev
          fi
