name: Cleanup Temporary Artifacts

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Delete temporary branch and artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push origin --delete temp-write-test || true
          git rm -f --ignore-unmatch tmp_write_test.txt .github/workflows/update-todo-list.yml .github/workflows/cleanup.yml
          git commit -m "chore: remove temporary workflow and test artifacts" || echo "nothing to commit"
          git push origin dev || true
